name: Build JevanMantra Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          mkdir -p "${ANDROID_HOME}/licenses"
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "${ANDROID_HOME}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "${ANDROID_HOME}/licenses/android-sdk-preview-license"
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare .env, Firebase config, and debug.keystore
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f app/src/main/res/values/firebase_applet_config.xml ]; then
            mkdir -p app/src/main/res/values
            cat << 'EOF' > app/src/main/res/values/firebase_applet_config.xml
          <?xml version="1.0" encoding="utf-8" standalone="no"?>
          <resources>
              <string name="firestore_database_id" translatable="false">ai-studio-android-jevanman-f9e8af8c-b212-450b-911c-7685310900bb</string>
              <string name="recaptcha_site_key" translatable="false">6LeYuRwuAAAAAOLnkxe5LEIRW-XsnNSaRRZiRl2a</string>
          </resources>
          EOF
          fi
          if [ ! -f app/google-services.json ]; then
            KEY_PART_1="AIzaSy"
            KEY_PART_2="AsgOtvqolDlnqRhc0s7EzB_ejP7xtwluw"
            cat << EOF > app/google-services.json
          {
            "project_info": {
              "project_number": "856502901252",
              "project_id": "gen-lang-client-0828810217",
              "storage_bucket": "gen-lang-client-0828810217.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:856502901252:android:8b440d2175242b276db351",
                  "android_client_info": {
                    "package_name": "com.aistudio.jevanmantra.vdkmxp"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "856502901252-pqrntrg7ej2ur508coa3csfgp3kjouj6.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.aistudio.jevanmantra.vdkmxp",
                      "certificate_hash": "8df55a0275be41e8b6be6459f0f4d6763806d4fb"
                    }
                  },
                  {
                    "client_id": "856502901252-9tvucfe6mt2cdvglp2gdvd026gncubek.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "${KEY_PART_1}${KEY_PART_2}"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "856502901252-9tvucfe6mt2cdvglp2gdvd026gncubek.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Upload JevanMantra APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JevanMantra-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
